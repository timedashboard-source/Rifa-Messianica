<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Administrativo - Rifa Messiânica</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef7ef;color:#263d2d}.hidden{display:none!important}header{background:#245d39;color:#fff;padding:18px}header div,main{max-width:1180px;margin:auto}.login{max-width:420px;margin:70px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 30px #244b3022}h1,h2{margin-top:0}label{display:block;font-weight:700;margin:14px 0 6px}input,select{width:100%;padding:12px;border:1px solid #b7cabb;border-radius:8px;font-size:15px}button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#2f7b4a;color:#fff}.danger{background:#b34840}.secondary{background:#66746b}.top{display:flex;justify-content:space-between;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat{background:#fff;padding:18px;border-radius:12px;box-shadow:0 4px 14px #315a3a16}.stat b{display:block;font-size:25px;color:#2f7b4a}.filters{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:18px}.card{background:#fff;margin-bottom:12px;padding:18px;border-radius:12px;box-shadow:0 4px 14px #315a3a16}.card-head{display:flex;justify-content:space-between;gap:12px}.status{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:800}.aguardando_pagamento{background:#fff1bd;color:#725500}.pago{background:#ccebd5;color:#165b2d}.cancelado{background:#eee;color:#555}.details{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.details small{display:block;color:#657269}.actions{display:flex;gap:8px;flex-wrap:wrap}.msg{margin-top:12px;color:#a3312b}.empty{text-align:center;padding:40px;background:#fff;border-radius:12px}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.filters,.details{grid-template-columns:1fr}.card-head{flex-direction:column}}
</style></head><body>
<section id="loginBox" class="login"><h1>Painel da Rifa</h1><p>Entre com o usuário administrador do Firebase.</p><label>E-mail</label><input id="email" type="email"><label>Senha</label><input id="password" type="password"><button id="loginBtn" style="width:100%;margin-top:18px">Entrar</button><div id="loginMsg" class="msg"></div></section>
<div id="panel" class="hidden"><header><div class="top"><div><b>Rifa Messiânica</b><br><small>Painel administrativo</small></div><button id="logout" class="secondary">Sair</button></div></header><main><div class="stats"><div class="stat"><small>Reservas</small><b id="sTotal">0</b></div><div class="stat"><small>Aguardando</small><b id="sWaiting">0</b></div><div class="stat"><small>Pagas</small><b id="sPaid">0</b></div><div class="stat"><small>Valor pago</small><b id="sValue">R$ 0,00</b></div></div><div class="filters"><input id="search" placeholder="Pesquisar nome, WhatsApp ou número"><select id="filter"><option value="todos">Todos os status</option><option value="aguardando_pagamento">Aguardando pagamento</option><option value="pago">Pago</option><option value="cancelado">Cancelado</option></select></div><div id="list"></div></main></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";import{getDatabase,ref,onValue,update}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
const config={apiKey:"AIzaSyA1mDq7x9z4QSPTYt5buao3K4iPBgwyOBI",authDomain:"rifa-messianica.firebaseapp.com",databaseURL:"https://rifa-messianica-default-rtdb.firebaseio.com",projectId:"rifa-messianica",storageBucket:"rifa-messianica.firebasestorage.app",messagingSenderId:"417235255493",appId:"1:417235255493:web:e69ffd20a63d28a47c30ac"};
const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app),$=s=>document.querySelector(s),money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);let data=[];
$('#loginBtn').onclick=async()=>{try{$('#loginMsg').textContent='';await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value)}catch(e){$('#loginMsg').textContent='Não foi possível entrar. Confira e-mail, senha e autorização de administrador.'}};$('#logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(u){$('#loginBox').classList.add('hidden');$('#panel').classList.remove('hidden');listen()}else{$('#panel').classList.add('hidden');$('#loginBox').classList.remove('hidden')}});
function listen(){onValue(ref(db,'reservas'),snap=>{data=[];const root=snap.val()||{};Object.entries(root).forEach(([uid,rs])=>Object.entries(rs||{}).forEach(([id,r])=>data.push({...r,uid,id})));data.sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));render() },e=>{$('#list').innerHTML='<div class="empty">Acesso negado. Confira o UID inserido nas regras do Firebase.</div>'})}
function render(){const q=$('#search').value.toLowerCase().replace(/\D/g,''),raw=$('#search').value.toLowerCase(),f=$('#filter').value;const rows=data.filter(r=>(f==='todos'||r.status===f)&&(!raw||`${r.nome} ${r.whatsapp} ${(r.numeros||[]).join(' ')}`.toLowerCase().includes(raw)||String(r.whatsapp||'').includes(q)));$('#sTotal').textContent=data.length;$('#sWaiting').textContent=data.filter(x=>x.status==='aguardando_pagamento').length;$('#sPaid').textContent=data.filter(x=>x.status==='pago').length;$('#sValue').textContent=money(data.filter(x=>x.status==='pago').reduce((s,x)=>s+(x.valorTotal||0),0));$('#list').innerHTML=rows.length?rows.map(r=>`<article class="card"><div class="card-head"><div><b>${esc(r.nome||'Sem nome')}</b><br><small>${phone(r.whatsapp)}</small></div><span class="status ${r.status}">${label(r.status)}</span></div><div class="details"><div><small>Números</small><b>${(r.numeros||[]).join(', ')}</b></div><div><small>Quantidade</small><b>${r.quantidade||0}</b></div><div><small>Valor</small><b>${money(r.valorTotal)}</b></div><div><small>Data</small><b>${r.criadoEm?new Date(r.criadoEm).toLocaleString('pt-BR'):'-'}</b></div></div><div class="actions">${r.status!=='pago'?`<button onclick="pay('${r.uid}','${r.id}')">Confirmar pagamento</button>`:''}${r.status!=='cancelado'?`<button class="danger" onclick="cancelR('${r.uid}','${r.id}')">Cancelar e liberar</button>`:''}</div></article>`).join(''):'<div class="empty">Nenhuma reserva encontrada.</div>'}
window.pay=async(uid,id)=>{const r=data.find(x=>x.uid===uid&&x.id===id);if(!r||!confirm(`Confirmar pagamento de ${r.nome}?`))return;const changes={};changes[`reservas/${uid}/${id}/status`]='pago';changes[`reservas/${uid}/${id}/pagoEm`]=Date.now();(r.numeros||[]).forEach(n=>changes[`numeros/${n}/status`]='pago');try{await update(ref(db),changes);alert('Pagamento confirmado.')}catch(e){alert('Ação bloqueada pelas regras do Firebase.')}};
window.cancelR=async(uid,id)=>{const r=data.find(x=>x.uid===uid&&x.id===id);if(!r||!confirm(`Cancelar a reserva de ${r.nome} e liberar ${(r.numeros||[]).join(', ')}?`))return;const changes={};changes[`reservas/${uid}/${id}/status`]='cancelado';changes[`reservas/${uid}/${id}/canceladoEm`]=Date.now();(r.numeros||[]).forEach(n=>changes[`numeros/${n}`]=null);try{await update(ref(db),changes);alert('Reserva cancelada e números liberados.')}catch(e){alert('Ação bloqueada pelas regras do Firebase.')}};
$('#search').oninput=render;$('#filter').onchange=render;function label(s){return({aguardando_pagamento:'Aguardando pagamento',pago:'Pago',cancelado:'Cancelado'})[s]||s}function phone(v=''){const d=String(v).replace(/\D/g,'');return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:v}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m])}
</script></body></html>
