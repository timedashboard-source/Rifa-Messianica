<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel Administrativo - Rifa Messiânica</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef7ef;color:#263d2d}.hidden{display:none!important}header{background:#245d39;color:#fff;padding:18px}header>div,main{max-width:1180px;margin:auto}.login{max-width:420px;margin:70px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 30px #244b3022}h1,h2{margin-top:0}label{display:block;font-weight:700;margin:14px 0 6px}input,select{width:100%;padding:12px;border:1px solid #b7cabb;border-radius:8px;font-size:15px}button{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#2f7b4a;color:#fff}.danger{background:#b34840}.secondary{background:#66746b}.top{display:flex;justify-content:space-between;align-items:center}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat{background:#fff;padding:18px;border-radius:12px;box-shadow:0 4px 14px #315a3a16}.stat b{display:block;font-size:25px;color:#2f7b4a}.tabs{display:flex;gap:8px;margin:18px 0;border-bottom:1px solid #c5d7c9;padding-bottom:8px;flex-wrap:wrap}.tab{background:#dceadf;color:#285b39}.tab.active{background:#2f7b4a;color:#fff}.filters{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:18px}.card{background:#fff;margin-bottom:12px;padding:18px;border-radius:12px;box-shadow:0 4px 14px #315a3a16}.card-head{display:flex;justify-content:space-between;gap:12px}.status{padding:5px 9px;border-radius:20px;font-size:12px;font-weight:800}.aguardando_pagamento{background:#fff1bd;color:#725500}.pago{background:#ccebd5;color:#165b2d}.cancelado{background:#eee;color:#555}.details{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.details small{display:block;color:#657269}.actions{display:flex;gap:8px;flex-wrap:wrap}.msg{margin-top:12px;color:#a3312b}.empty{text-align:center;padding:40px;background:#fff;border-radius:12px}.unit-group{background:#fff;border-radius:14px;margin-bottom:18px;overflow:hidden;box-shadow:0 4px 14px #315a3a16}.unit-title{background:#dceadf;color:#245d39;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.sold-list{display:grid;grid-template-columns:repeat(2,1fr);gap:0}.sold-row{padding:14px 18px;border-bottom:1px solid #e2ece4;display:grid;grid-template-columns:110px 1fr 150px;gap:12px;align-items:center}.sold-number{font-size:18px;color:#245d39}.sold-name{font-weight:700}.sold-phone{font-size:13px;color:#627067}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px;flex-wrap:wrap}.toolbar button{background:#3c6d4b}.note{font-size:13px;color:#657269}.count-badge{background:#fff;color:#245d39;border-radius:20px;padding:5px 10px;font-weight:800}@media(max-width:850px){.sold-list{grid-template-columns:1fr}.details{grid-template-columns:1fr 1fr}.sold-row{grid-template-columns:90px 1fr}}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.filters,.details{grid-template-columns:1fr}.card-head{flex-direction:column}.sold-row{grid-template-columns:1fr}.top{gap:12px}}
</style>
</head>
<body>
<section id="loginBox" class="login"><h1>Painel da Rifa</h1><p>Entre com o usuário administrador do Firebase.</p><label>E-mail</label><input id="email" type="email"><label>Senha</label><input id="password" type="password"><button id="loginBtn" style="width:100%;margin-top:18px">Entrar</button><div id="loginMsg" class="msg"></div></section>
<div id="panel" class="hidden"><header><div class="top"><div><b>Rifa Messiânica</b><br><small>Painel administrativo</small></div><button id="logout" class="secondary">Sair</button></div></header><main>
<div class="stats"><div class="stat"><small>Reservas</small><b id="sTotal">0</b></div><div class="stat"><small>Aguardando</small><b id="sWaiting">0</b></div><div class="stat"><small>Pagas</small><b id="sPaid">0</b></div><div class="stat"><small>Valor pago</small><b id="sValue">R$ 0,00</b></div></div>
<div class="tabs"><button class="tab active" data-view="reservas">Reservas</button><button class="tab" data-view="vendidos">Números vendidos</button></div>
<section id="reservasView"><div class="filters"><input id="search" placeholder="Pesquisar nome, WhatsApp ou número"><select id="filter"><option value="todos">Todos os status</option><option value="aguardando_pagamento">Aguardando pagamento</option><option value="pago">Pago</option><option value="cancelado">Cancelado</option></select></div><div id="list"></div></section>
<section id="vendidosView" class="hidden"><div class="toolbar"><div><h2 style="margin-bottom:4px">Lista de números vendidos</h2><div class="note">Mostra somente reservas com pagamento confirmado.</div></div><button id="exportCsv">Exportar CSV</button></div><div class="filters"><input id="soldSearch" placeholder="Pesquisar número, nome ou WhatsApp"><select id="unitFilter"><option value="todas">Todas as unidades</option></select></div><div id="soldList"></div></section>
</main></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";import{getDatabase,ref,onValue,update}from"https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";
const config={apiKey:"AIzaSyA1mDq7x9z4QSPTYt5buao3K4iPBgwyOBI",authDomain:"rifa-messianica.firebaseapp.com",databaseURL:"https://rifa-messianica-default-rtdb.firebaseio.com",projectId:"rifa-messianica",storageBucket:"rifa-messianica.firebasestorage.app",messagingSenderId:"417235255493",appId:"1:417235255493:web:e69ffd20a63d28a47c30ac"};
const unidades=["Igreja Santa Catarina","JC Florianópolis","JC Blumenau","JC Criciúma","JC Itajaí","JC Baln. Camboriú","JC Tubarão","JC Joinville","Urupema"];
const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app),$=s=>document.querySelector(s),money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);let data=[];
$('#unitFilter').innerHTML+=unidades.map(u=>`<option value="${u}">${u}</option>`).join('');
$('#loginBtn').onclick=async()=>{try{$('#loginMsg').textContent='';await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value)}catch(e){$('#loginMsg').textContent='Não foi possível entrar. Confira e-mail, senha e autorização.'}};$('#logout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(u){$('#loginBox').classList.add('hidden');$('#panel').classList.remove('hidden');listen()}else{$('#panel').classList.add('hidden');$('#loginBox').classList.remove('hidden')}});
function listen(){onValue(ref(db,'reservas'),snap=>{data=[];const root=snap.val()||{};Object.entries(root).forEach(([uid,rs])=>Object.entries(rs||{}).forEach(([id,r])=>data.push({...r,uid,id})));data.sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));renderAll()},()=>{$('#list').innerHTML='<div class="empty">Acesso negado. Confira o UID nas regras do Firebase.</div>'})}
function renderAll(){renderReservations();renderSold();$('#sTotal').textContent=data.length;$('#sWaiting').textContent=data.filter(x=>x.status==='aguardando_pagamento').length;$('#sPaid').textContent=data.filter(x=>x.status==='pago').length;$('#sValue').textContent=money(data.filter(x=>x.status==='pago').reduce((s,x)=>s+(x.valorTotal||0),0))}
function renderReservations(){const raw=$('#search').value.toLowerCase(),digits=raw.replace(/\D/g,''),f=$('#filter').value;const rows=data.filter(r=>(f==='todos'||r.status===f)&&(!raw||`${r.nome||''} ${r.whatsapp||''} ${(r.numeros||[]).join(' ')}`.toLowerCase().includes(raw)||String(r.whatsapp||'').includes(digits)));$('#list').innerHTML=rows.length?rows.map(r=>`<article class="card"><div class="card-head"><div><b>${esc(r.nome||'Sem nome')}</b><br><small>${phone(r.whatsapp)}</small></div><span class="status ${r.status}">${label(r.status)}</span></div><div class="details"><div><small>Unidade</small><b>${esc(reservationUnit(r))}</b></div><div><small>Números</small><b>${(r.numeros||[]).join(', ')}</b></div><div><small>Quantidade</small><b>${r.quantidade||0}</b></div><div><small>Valor</small><b>${money(r.valorTotal)}</b></div><div><small>Data</small><b>${r.criadoEm?new Date(r.criadoEm).toLocaleString('pt-BR'):'-'}</b></div></div><div class="actions">${r.status==='aguardando_pagamento'?`<button onclick="pay('${r.uid}','${r.id}')">Confirmar pagamento</button><button class="danger" onclick="cancelR('${r.uid}','${r.id}')">Cancelar e liberar</button>`:''}</div></article>`).join(''):'<div class="empty">Nenhuma reserva encontrada.</div>'}
function soldRows(){const rows=[];data.filter(r=>r.status==='pago').forEach(r=>(r.numeros||[]).forEach(n=>rows.push({numero:String(n).padStart(5,'0'),nome:r.nome||'Sem nome',whatsapp:r.whatsapp||'',unidade:r.unidade||unitByNumber(n),pagoEm:r.pagoEm||r.criadoEm||0})));return rows.sort((a,b)=>Number(a.numero)-Number(b.numero))}
function renderSold(){const raw=$('#soldSearch').value.toLowerCase(),digits=raw.replace(/\D/g,''),uf=$('#unitFilter').value;const rows=soldRows().filter(x=>(uf==='todas'||x.unidade===uf)&&(!raw||`${x.numero} ${x.nome} ${x.whatsapp}`.toLowerCase().includes(raw)||String(x.whatsapp).includes(digits)));if(!rows.length){$('#soldList').innerHTML='<div class="empty">Nenhum número vendido encontrado.</div>';return}const groups={};rows.forEach(x=>(groups[x.unidade]??=[]).push(x));$('#soldList').innerHTML=unidades.filter(u=>groups[u]?.length).map(u=>`<section class="unit-group"><div class="unit-title"><b>${u}</b><span class="count-badge">${groups[u].length} número(s)</span></div><div class="sold-list">${groups[u].map(x=>`<div class="sold-row"><b class="sold-number">${x.numero}</b><div><div class="sold-name">${esc(x.nome)}</div><div class="sold-phone">${phone(x.whatsapp)}</div></div><small>${x.pagoEm?new Date(x.pagoEm).toLocaleDateString('pt-BR'):''}</small></div>`).join('')}</div></section>`).join('')}
window.pay=async(uid,id)=>{const r=data.find(x=>x.uid===uid&&x.id===id);if(!r||r.status!=='aguardando_pagamento')return;if(!confirm(`Confirmar pagamento de ${r.nome}?`))return;const ch={};ch[`reservas/${uid}/${id}/status`]='pago';ch[`reservas/${uid}/${id}/pagoEm`]=Date.now();(r.numeros||[]).forEach(n=>ch[`numeros/${n}/status`]='pago');try{await update(ref(db),ch);alert('Pagamento confirmado.')}catch{alert('Ação bloqueada pelas regras do Firebase.')}};
window.cancelR=async(uid,id)=>{const r=data.find(x=>x.uid===uid&&x.id===id);if(!r||r.status!=='aguardando_pagamento')return;if(!confirm(`Cancelar a reserva de ${r.nome} e liberar ${(r.numeros||[]).join(', ')}?`))return;const ch={};ch[`reservas/${uid}/${id}/status`]='cancelado';ch[`reservas/${uid}/${id}/canceladoEm`]=Date.now();(r.numeros||[]).forEach(n=>ch[`numeros/${n}`]=null);try{await update(ref(db),ch);alert('Reserva cancelada e números liberados.')}catch{alert('Ação bloqueada pelas regras do Firebase.')}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#reservasView').classList.toggle('hidden',b.dataset.view!=='reservas');$('#vendidosView').classList.toggle('hidden',b.dataset.view!=='vendidos')});
$('#search').oninput=renderReservations;$('#filter').onchange=renderReservations;$('#soldSearch').oninput=renderSold;$('#unitFilter').onchange=renderSold;
$('#exportCsv').onclick=()=>{const rows=soldRows();if(!rows.length)return alert('Não há números vendidos para exportar.');const csv=['Unidade;Numero;Nome;WhatsApp;Data do pagamento',...rows.map(x=>[x.unidade,x.numero,x.nome,x.whatsapp,x.pagoEm?new Date(x.pagoEm).toLocaleString('pt-BR'):''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';'))].join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='numeros_vendidos_rifa.csv';a.click();URL.revokeObjectURL(a.href)};
function reservationUnit(r){return r.unidade||unitByNumber((r.numeros||[])[0])}function unitByNumber(n){const v=Number(n);if(!v)return'Não identificada';const i=Math.min(8,Math.max(0,Math.ceil(v/1000)-1));return unidades[i]}function label(s){return({aguardando_pagamento:'Aguardando pagamento',pago:'Pago',cancelado:'Cancelado'})[s]||s}function phone(v=''){const d=String(v).replace(/\D/g,'');return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:v}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m])}
</script></body></html>
